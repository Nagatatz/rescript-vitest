name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting (oxfmt)
        run: pnpm format:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Build ReScript bindings
        run: pnpm build

      - name: Run tests
        run: pnpm test

  # The `vitest` peer range is `^4.0.0 || ^5.0.0`, but the lockfile pins
  # Vitest 5. This job swaps in the latest Vitest 4 so the older major stays
  # covered by the same dogfood suite.
  test-vitest-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vitest 4
        run: pnpm add -D vitest@^4.0.0 @vitest/coverage-v8@^4.0.0

      - name: Build ReScript bindings
        run: pnpm build

      - name: Run tests
        run: pnpm test
